$schema: https://json-schema.org/draft/2020-12/schema
$id: https://usecaseapi.dev/schemas/usecaseapi.manifest.v1.schema.yaml
title: UseCaseAPI Manifest v1
type: object
required:
  - kind
  - usecases
additionalProperties: true
properties:
  kind:
    const: usecaseapi.manifest/v1
  metadata:
    type: object
    additionalProperties: true
    properties:
      name:
        type: string
        minLength: 1
  runtime:
    type: object
    additionalProperties: true
    properties:
      language:
        const: python
      python:
        type: string
      protocol:
        const: usecaseapi.inprocess.async_call/v1
  layout:
    type: object
    additionalProperties: true
    properties:
      package:
        type: string
      contracts_root:
        type: string
      implementations_root:
        type: string
      tests_root:
        type: string
  usecases:
    type: array
    minItems: 1
    items:
      $ref: "#/$defs/usecase"
$defs:
  usecase:
    type: object
    required:
      - name
      - version
      - source
      - input
      - output
      - models
    additionalProperties: true
    properties:
      name:
        type: string
        pattern: "^[a-z][a-z0-9_]*(\\.[a-z][a-z0-9_]*)+$"
      version:
        type: integer
        minimum: 1
      key:
        type: string
      domain:
        type: string
      description:
        type: string
      stable:
        type: boolean
      deprecated:
        type: boolean
      superseded_by:
        type: string
      tags:
        type: array
        items:
          type: string
      protocol:
        type: object
        additionalProperties: true
        properties:
          kind:
            const: usecaseapi.inprocess.async_call/v1
          signature:
            type: string
      source:
        type: object
        required:
          - contract_module
          - protocol_class
          - ref
        additionalProperties: true
        properties:
          contract_file:
            type: string
          implementation_file:
            type: string
          contract_module:
            type: string
          protocol_class:
            type: string
            pattern: "^[A-Za-z_][A-Za-z0-9_]*$"
          implementation_class:
            type: string
            pattern: "^[A-Za-z_][A-Za-z0-9_]*$"
          ref:
            type: string
            pattern: "^[A-Za-z_][A-Za-z0-9_]*$"
      input:
        type: string
      output:
        type: string
      models:
        type: array
        minItems: 1
        items:
          $ref: "#/$defs/model"
      errors:
        type: array
        items:
          $ref: "#/$defs/error"
      raises:
        type: array
        items:
          type: string
      known_errors:
        type: array
        items:
          type: string
      uses:
        type: array
        items:
          type: string
          pattern: "^[a-z][a-z0-9_]*(\\.[a-z][a-z0-9_]*)+@v[1-9][0-9]*$"
  model:
    type: object
    required:
      - name
      - fields
    additionalProperties: true
    properties:
      name:
        type: string
        pattern: "^[A-Za-z_][A-Za-z0-9_]*$"
      description:
        type: string
      module:
        type: string
      fields:
        type: array
        items:
          $ref: "#/$defs/field"
  error:
    type: object
    required:
      - name
      - code
    additionalProperties: true
    properties:
      name:
        type: string
        pattern: "^[A-Za-z_][A-Za-z0-9_]*$"
      base:
        type: string
      code:
        type: string
        minLength: 1
      module:
        type: string
      fields:
        type: array
        items:
          $ref: "#/$defs/field"
  field:
    type: object
    required:
      - name
      - type
    additionalProperties: true
    properties:
      name:
        type: string
        pattern: "^[A-Za-z_][A-Za-z0-9_]*$"
      type:
        type: string
        minLength: 1
      required:
        type: boolean
      description:
        type: string
