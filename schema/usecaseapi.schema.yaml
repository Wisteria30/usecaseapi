$schema: https://json-schema.org/draft/2020-12/schema
$id: https://usecaseapi.dev/schemas/usecaseapi.schema.yaml
title: UseCaseAPI OpenAPI Profile Manifest v2
type: object
required:
  - openapi
  - info
  - paths
  - components
  - x-usecaseapi
additionalProperties: true
properties:
  openapi:
    const: 3.1.0
  info:
    type: object
    required:
      - title
      - version
    additionalProperties: true
    properties:
      title:
        type: string
        minLength: 1
      version:
        type: string
        minLength: 1
  paths:
    type: object
    minProperties: 1
  components:
    type: object
    additionalProperties: true
    properties:
      schemas:
        type: object
      responses:
        type: object
  x-usecaseapi:
    type: object
    required:
      - version
      - profile
      - manifestKind
    additionalProperties: true
    properties:
      version:
        const: 3.1.0
      profile:
        const: usecaseapi.openapi
      manifestKind:
        const: usecaseapi.openapi.profile/3.1.0
