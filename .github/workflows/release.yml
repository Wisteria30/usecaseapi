name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Install Python
        run: uv python install 3.13
      - name: Sync dependencies
        run: uv sync --extra dev --python 3.13
      - name: Test
        run: uv run --python 3.13 pytest
      - name: Mypy
        run: uv run --python 3.13 mypy
      - name: Ruff
        run: uv run --python 3.13 ruff check .
      - name: Build
        run: uv build
      - name: Publish
        run: uv publish
