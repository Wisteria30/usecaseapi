name: Release

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.version.outputs.should_release }}
      version: ${{ steps.version.outputs.version }}
      tag_name: ${{ steps.version.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check version
        id: version
        run: |
          set -euo pipefail
          VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          TAG_NAME="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"

          if [ "${{ github.ref_type }}" = "tag" ]; then
            if [ "${{ github.ref_name }}" != "$TAG_NAME" ]; then
              echo "::error::Tag ${{ github.ref_name }} does not match pyproject.toml version ${VERSION}"
              exit 1
            fi
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          OLD_VERSION="$(git show "${{ github.event.before }}":pyproject.toml 2>/dev/null | python -c 'import sys, tomllib; print(tomllib.loads(sys.stdin.read())["project"]["version"])' || true)"
          if [ -n "$OLD_VERSION" ] && [ "$VERSION" != "$OLD_VERSION" ]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          fi

  validate:
    runs-on: ubuntu-latest
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: release-python-3.13
      - name: Sync dependencies
        run: uv sync --frozen --extra dev
      - name: Test
        run: uv run coverage run -m pytest
      - name: Coverage
        run: uv run coverage report -m
      - name: Mypy
        run: uv run mypy
      - name: Ruff
        run: uv run ruff check .
      - name: Build
        run: uv build
      - name: Check distribution metadata
        run: uv run twine check dist/*
      - name: Verify wheel installation
        run: uv run --isolated --no-project --with dist/*.whl scripts/verify_distribution.py
      - name: Verify source distribution installation
        run: uv run --isolated --no-project --with dist/*.tar.gz scripts/verify_distribution.py
      - name: Upload distributions
        uses: actions/upload-artifact@v7.0.1
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    runs-on: ubuntu-latest
    needs: [check-version, validate]
    if: needs.check-version.outputs.should_release == 'true'
    environment:
      name: pypi
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: publish-python-3.13
      - name: Download distributions
        uses: actions/download-artifact@v7
        with:
          name: distributions
          path: dist
      - name: Create release tag
        if: github.ref_type != 'tag'
        env:
          TAG_NAME: ${{ needs.check-version.outputs.tag_name }}
        run: |
          set -euo pipefail
          git fetch --tags --force origin
          if git rev-parse -q --verify "refs/tags/${TAG_NAME}" >/dev/null; then
            TAG_COMMIT="$(git rev-list -n 1 "$TAG_NAME")"
            if [ "$TAG_COMMIT" != "$GITHUB_SHA" ]; then
              echo "::error::Tag ${TAG_NAME} already exists at ${TAG_COMMIT}, expected ${GITHUB_SHA}"
              exit 1
            fi
            echo "Tag ${TAG_NAME} already exists at ${GITHUB_SHA}; reusing it"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG_NAME" -m "Release ${TAG_NAME}" "$GITHUB_SHA"
          git push origin "$TAG_NAME"
      - name: Publish
        run: uv publish
