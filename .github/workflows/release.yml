name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: release-python-3.13
      - name: Sync dependencies
        run: uv sync --frozen --extra dev
      - name: Test
        run: uv run coverage run -m pytest
      - name: Coverage
        run: uv run coverage report -m
      - name: Mypy
        run: uv run mypy
      - name: Ruff
        run: uv run ruff check .
      - name: Build
        run: uv build
      - name: Check distribution metadata
        run: uv run twine check dist/*
      - name: Verify wheel installation
        run: uv run --isolated --no-project --with dist/*.whl scripts/verify_distribution.py
      - name: Verify source distribution installation
        run: uv run --isolated --no-project --with dist/*.tar.gz scripts/verify_distribution.py
      - name: Publish
        run: uv publish
