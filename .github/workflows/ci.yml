name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Install Python
        run: uv python install ${{ matrix.python-version }}
      - name: Sync dependencies
        run: uv sync --extra dev --python ${{ matrix.python-version }}
      - name: Test
        run: uv run --python ${{ matrix.python-version }} coverage run -m pytest
      - name: Coverage
        run: |
          uv run --python ${{ matrix.python-version }} coverage report -m
          uv run --python ${{ matrix.python-version }} coverage json
          PYTHON_VERSION=${{ matrix.python-version }} uv run --python ${{ matrix.python-version }} python scripts/write_coverage_summary.py
      - name: Mypy
        run: uv run --python ${{ matrix.python-version }} mypy
      - name: Ruff
        run: uv run --python ${{ matrix.python-version }} ruff check .
      - name: Build
        run: uv build
