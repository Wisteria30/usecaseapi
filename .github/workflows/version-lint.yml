name: Version Lint

on:
  pull_request:

permissions:
  contents: read

jobs:
  version-lint:
    name: Version Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require pyproject version bump for shipped changes
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.sha }}"
          CHANGED="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          echo "$CHANGED"

          if ! echo "$CHANGED" | grep -Eq '^(src/|README\.md|docs/|examples/|scripts/|pyproject\.toml|uv\.lock|LICENSE|RELEASE\.md|SECURITY\.md|CONTRIBUTING\.md|CODE_OF_CONDUCT\.md)'; then
            exit 0
          fi

          OLD_VERSION="$(git show "$BASE_SHA":pyproject.toml | python -c 'import sys, tomllib; print(tomllib.loads(sys.stdin.read())["project"]["version"])')"
          NEW_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"

          if [ "$OLD_VERSION" = "$NEW_VERSION" ]; then
            echo "::error::pyproject.toml [project].version must be bumped when shipped files change"
            exit 1
          fi
