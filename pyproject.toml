[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "usecaseapi"
version = "1.0.0"
description = "Protocol-first, graph-aware, same-process UseCase API contracts for Python."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.15"
authors = [
  { name = "UseCaseAPI Contributors" }
]
maintainers = [
  { name = "UseCaseAPI Contributors" }
]
keywords = [
  "usecase",
  "application-api",
  "contracts",
  "protocol",
  "pydantic",
  "workflow",
  "ai-agents"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.12.4,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.1",
  "mypy>=1.18.2",
  "ruff>=0.14.6",
  "build>=1.3.0",
  "coverage>=7.12.0",
  "twine>=6.2.0",
]

[project.urls]
Homepage = "https://github.com/Wisteria30/usecaseapi"
Documentation = "https://github.com/Wisteria30/usecaseapi/tree/main/docs"
Repository = "https://github.com/Wisteria30/usecaseapi"
Issues = "https://github.com/Wisteria30/usecaseapi/issues"

[project.scripts]
usecaseapi = "usecaseapi.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/usecaseapi"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/scripts",
  "/examples",
  "/docs",
  "/README.md",
  "/LICENSE",
  "/CONTRIBUTING.md",
  "/CODE_OF_CONDUCT.md",
  "/SECURITY.md",
  "/RELEASE.md",
  "/pyproject.toml",
]

[tool.uv]
package = true
exclude-newer = "P7D"
trusted-publishing = "always"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["usecaseapi"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src:examples/basic"
files = ["src", "tests", "examples/basic"]
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_unreachable = true
show_error_codes = true

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "examples/basic"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = [
  "RUF012",
  "UP046",
  "UP047"
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
