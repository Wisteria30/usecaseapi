kind: usecaseapi.manifest/v1
metadata:
  name: basic
runtime:
  language: python
  python: '>=3.12,<3.15'
  protocol: usecaseapi.inprocess.async_call/v1
layout:
  contracts_root: src/commerce
  implementations_root: src
  package: commerce
usecases:
- name: commerce.check_availability
  version: 1
  key: commerce.check_availability@v1
  namespace: commerce
  description: Checks available inventory inside the commerce package.
  stable: true
  deprecated: false
  tags: []
  protocol:
    kind: usecaseapi.inprocess.async_call/v1
    signature: 'async __call__(input: CheckAvailabilityUseCaseInput) -> CheckAvailabilityUseCaseOutput'
  source:
    contract_module: commerce.usecases.check_availability.v1.check_availability_contract
    protocol_class: CheckAvailability
    implementation_class: CheckAvailabilityUseCase
    implementation_file: src/commerce/usecases/check_availability/v1/check_availability_usecase.py
    ref: CHECK_AVAILABILITY_USECASE
    contract_file: src/commerce/usecases/check_availability/v1/check_availability_contract.py
    binding_factory: composition.<lambda>
    binding_file: src/composition.py
  input: CheckAvailabilityUseCaseInput
  output: CheckAvailabilityUseCaseOutput
  models:
  - name: CheckAvailabilityUseCaseInput
    module: commerce.usecases.check_availability.v1.check_availability_contract
    fields:
    - name: sku_id
      type: str
      required: true
    - name: quantity
      type: int
      required: true
    description: Input required to check inventory availability.
  - name: CheckAvailabilityUseCaseOutput
    module: commerce.usecases.check_availability.v1.check_availability_contract
    fields:
    - name: available
      type: int
      required: true
    - name: ok
      type: bool
      required: true
    description: Inventory availability result.
  errors: []
  raises: []
  known_errors: []
  uses: []
- name: commerce.checkout
  version: 1
  key: commerce.checkout@v1
  namespace: commerce
  description: Workflow-style usecase that composes other usecases in-process.
  stable: true
  deprecated: false
  tags: []
  protocol:
    kind: usecaseapi.inprocess.async_call/v1
    signature: 'async __call__(input: CheckoutUseCaseInput) -> CheckoutUseCaseOutput'
  source:
    contract_module: commerce.usecases.checkout.v1.checkout_contract
    protocol_class: Checkout
    implementation_class: CheckoutUseCase
    implementation_file: src/commerce/usecases/checkout/v1/checkout_usecase.py
    ref: CHECKOUT_USECASE
    contract_file: src/commerce/usecases/checkout/v1/checkout_contract.py
    binding_factory: composition.<lambda>
    binding_file: src/composition.py
  input: CheckoutUseCaseInput
  output: CheckoutUseCaseOutput
  models:
  - name: CheckoutUseCaseInput
    module: commerce.usecases.checkout.v1.checkout_contract
    fields:
    - name: user_id
      type: str
      required: true
    - name: sku_id
      type: str
      required: true
    - name: quantity
      type: int
      required: true
    description: Input required to run checkout.
  - name: CheckoutUseCaseOutput
    module: commerce.usecases.checkout.v1.checkout_contract
    fields:
    - name: order_id
      type: str
      required: true
    description: Checkout result returned to callers.
  errors: []
  raises: []
  known_errors: []
  uses:
  - commerce.place_order@v1
- name: commerce.place_order
  version: 1
  key: commerce.place_order@v1
  namespace: commerce
  description: Creates an order after inventory has been confirmed.
  stable: true
  deprecated: false
  tags: []
  protocol:
    kind: usecaseapi.inprocess.async_call/v1
    signature: 'async __call__(input: PlaceOrderUseCaseInput) -> PlaceOrderUseCaseOutput'
  source:
    contract_module: commerce.usecases.place_order.v1.place_order_contract
    protocol_class: PlaceOrder
    implementation_class: PlaceOrderUseCase
    implementation_file: src/commerce/usecases/place_order/v1/place_order_usecase.py
    ref: PLACE_ORDER_USECASE
    contract_file: src/commerce/usecases/place_order/v1/place_order_contract.py
    binding_factory: composition.<lambda>
    binding_file: src/composition.py
  input: PlaceOrderUseCaseInput
  output: PlaceOrderUseCaseOutput
  models:
  - name: Item
    module: commerce.usecases.place_order.v1.place_order_contract
    fields:
    - name: sku_id
      type: str
      required: true
    - name: quantity
      type: int
      required: true
    description: Order item requested by the caller.
  - name: PlaceOrderUseCaseInput
    module: commerce.usecases.place_order.v1.place_order_contract
    fields:
    - name: user_id
      type: str
      required: true
    - name: item
      type: Item
      required: true
    description: Input required to place an order.
  - name: PlaceOrderUseCaseOutput
    module: commerce.usecases.place_order.v1.place_order_contract
    fields:
    - name: order_id
      type: str
      required: true
    - name: status
      type: Literal['accepted']
      required: true
    description: Accepted order result.
  errors:
  - name: PlaceOrderError
    module: commerce.usecases.place_order.v1.place_order_contract
    base: UseCaseError
    code: commerce.place_order
    fields: []
  - name: InventoryShortage
    module: commerce.usecases.place_order.v1.place_order_contract
    base: PlaceOrderError
    code: commerce.place_order.inventory_shortage
    fields:
    - name: sku_id
      type: str
      required: true
    - name: requested
      type: int
      required: true
    - name: available
      type: int
      required: true
  raises:
  - PlaceOrderError
  known_errors:
  - InventoryShortage
  uses:
  - commerce.check_availability@v1
